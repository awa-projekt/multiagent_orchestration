[mypy]
python_version = 3.11
strict = True
namespace_packages = True
explicit_package_bases = True
mypy_path = src, examples
plugins = pydantic.mypy

[mypy-langchain.*]
ignore_missing_imports = True

[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-langchain_core.*]
ignore_missing_imports = True

[mypy-langchain_openai.*]
ignore_missing_imports = True

[mypy-langchain_anthropic.*]
ignore_missing_imports = True

[mypy-psycopg.*]
ignore_missing_imports = True

[mypy-psycopg_pool.*]
ignore_missing_imports = True

[mypy-langchain_mcp_adapters.*]
ignore_missing_imports = True

[mypy-mcp.*]
ignore_missing_imports = True

# numpy 2.5 ships stubs in Python 3.12 syntax, which mypy rejects at python_version 3.11.
[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True

# The export copies awa.kernel.conditions next to approvals.py; the source tree has no sibling.
[mypy-awa.exporter.runtime_src.conditions]
ignore_missing_imports = True
