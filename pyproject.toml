[project]
name = "awa-agents"
version = "1.0.0b1"
description = "AI agents for business processes: hard limits in code, approvals, eval cases, and a one-agent exit to plain LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cd-bits" }]
keywords = [
  "agents",
  "ai",
  "blueprint",
  "evaluation",
  "human-in-the-loop",
  "langchain",
  "langgraph",
  "llm",
  "mcp",
  "multi-agent",
  "orchestration",
  "workflow",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "langchain>=1.4.3,<2",
  "langchain-core>=1.6.7,<2",
  "langgraph>=1.2.14,<2",
  "langgraph-checkpoint>=4.1,<5",
  "pydantic>=2.11",
  "pydantic-settings>=2.12",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.19.1",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/awa-projekt/multiagent_orchestration"
Source = "https://github.com/awa-projekt/multiagent_orchestration"
Issues = "https://github.com/awa-projekt/multiagent_orchestration/issues"
Changelog = "https://github.com/awa-projekt/multiagent_orchestration/blob/main/CHANGELOG.md"

[project.scripts]
awa = "awa.cli:main"

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7.5", "anthropic>=1.11"]
openai = ["langchain-openai>=1.6.7"]
postgres = ["langgraph-checkpoint-postgres>=3.0.3", "psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
studio = ["langgraph-cli[inmem]>=0.4"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
mcp = ["langchain-mcp-adapters>=0.3.2,<0.4", "mcp>=1.24,<2"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.32"]
otel = ["opentelemetry-api>=1.30"]
langfuse = [
  "awa-agents[otel]",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]
sql = ["PyMySQL>=1.1", "pymssql>=2.3"]
# Feature extras: one per optional part of awa. Each dependency set is defined once; an extra
# that needs the same set names the extra that defines it.
# The readers of Excel, Word and PDF files; Pillow turns and scales scanned pages for the vision
# model.
files = ["openpyxl>=3.1", "pypdf>=4.0", "python-docx>=1.1", "pillow>=11"]
# Company connectors: SQL databases and MCP servers (REST and OpenAPI need no extra).
connectors = ["awa-agents[sql,mcp]"]
# Microsoft 365 needs no SDK; its processes read Excel, Word and PDF files, and certificate
# sign-in signs its client assertion with cryptography.
m365 = ["awa-agents[files]", "cryptography>=46"]
# Knowledge bases and memory index documents, so they read the same file formats.
knowledge = ["awa-agents[files]"]
# Triggers, schedules and the worker; webhook triggers are served over HTTP.
automation = ["awa-agents[server]"]
# The web app (build assistant and approval inbox).
ui = ["awa-agents[server]"]
# The contract suites of awa.testing.contracts run under pytest.
testing = ["pytest>=8.4", "pytest-asyncio>=1.4"]
# Every runtime extra: `dev` without the test and lint tools.
all = [
  "awa-agents[anthropic,openai,postgres,mcp,server,otel,langfuse,sql,files,connectors,m365,knowledge,automation,ui]",
]
dev = [
  "awa-agents[all,testing]",
  "httpx>=0.27",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.4",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "import-linter>=2.15",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awa"]
# Editor and lint settings next to the product files stay out of the wheel
# (tests/architecture/measures.py reads this list when it checks the built wheel).
exclude = ["/src/awa/skills/.markdownlint-cli2.jsonc"]

# The sdist ships the package, the docs, the scripts, the examples, the tests
# and every file those tests read, so its own test suite runs from the
# extracted archive (patterns are anchored with a leading `/`).
[tool.hatch.build.targets.sdist]
include = [
  "/src/awa",
  "/src/ruff.toml",
  "/ruff.toml",
  "/docs",
  "/mkdocs.yml",
  "/scripts",
  "/tests",
  "/examples/*.py",
  "/examples/README.md",
  "/examples/blueprints",
  "/examples/evals",
  "/examples/recipes",
  "/examples/skills",
  "/examples/usecases",
  "/examples/microsoft",
  "/examples/observability",
  "/examples/processes",
  "/examples/benchmarks",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/.env.example",
  "/pyproject.toml",
  "/.importlinter",
  "/.dockerignore",
  "/.gitattributes",
  "/.gitignore",
  "/.gitlab-ci.yml",
  "/.github/workflows/ci.yml",
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/DEVELOPERS.md",
  "/TOUR.md",
  "/SECURITY.md",
  "/deploy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: calls a real model API; needs provider credentials, excluded by default",
  "model_requests_allowed: opt out of the suite-wide block on real model requests",
  "unconsumed_script: the test may end with scripted FakeChatModel responses left over",
  "live_network: reaches a real public website or API; run explicitly with -m live_network",
  "core_install: builds a venv with only the base dependencies; run explicitly with -m core_install",
  "packaging: builds the wheel and reads it back (needs uv); run explicitly with -m packaging",
  "slow: takes more than about ten seconds; the fast run (--fast) leaves it out",
  "first_run: builds the wheel, installs it fresh and follows the keyless start path (needs uv); run explicitly with -m first_run",
  "process: runs a whole business process end to end (offline, scripted models)",
  "docs: checks the README and the documentation (every test under tests/docs; run on their own)",
  "live_microsoft: reads a real Microsoft 365 tenant; needs AWA_TEST_MICROSOFT_PROJECT, run explicitly with -m live_microsoft",
]
# A test that hangs fails after 15 minutes instead of blocking the run (pytest-timeout).
timeout = 900
addopts = "--strict-markers --strict-config -m 'not integration and not live_network and not core_install and not packaging and not first_run and not live_microsoft'"
# A deprecation attributed to an awa module is an error; upstream noise stays a warning.
filterwarnings = ['error::DeprecationWarning:awa(\.|$)']

# `pytest --cov` measures branch coverage of the package; CI fails below
# `fail_under` (set a few points under the measured baseline of 91%).
[tool.coverage.run]
source = ["awa"]
branch = true

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]
