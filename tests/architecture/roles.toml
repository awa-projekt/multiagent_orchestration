# The role table: which role every module of src/awa plays (rule R1). Read by the guards GT1 and GT2.
#
# Roles
#   domain       run semantics and pure logic (agents, teams, workflows, tools, memory, tasks, ...).
#   protocol     a Protocol (or one-method callable) that a domain module needs, owned by its consumer.
#   backend      the code that touches a driver or implements a backend protocol against a technology (SQLite,
#                PostgreSQL, a JSON file, HTTP, SMTP); in-memory and file backends are backends too.
#   backend-kit  helpers shared by the backends of one family (PostgreSQL plumbing); imports no backend.
#   mixed        a backend protocol and its first backends in one module (legacy; the list only shrinks).
#   root         where backends are chosen and wired, and the code that drives the library (CLI, HTTP server, UI).
#   testing      test support that ships with the library (awa.testing).
#   seam         the upstream anti-corruption layer (awa._internal.upstream, awa._compat for MCP), the only importer of LangChain.
#   facade       every `__init__.py` (set automatically): re-exports, exempt from the direction rules.
#
# A package without an entry in [package] fails GT1, as a package without a layer in .importlinter
# fails the import contract test.
# [[override]] entries are checked: a path glob that matches no module, or two entries that match
# one module, fail GT1, so every module has exactly one role whatever the order.

[package]
_compat = "seam"
core = "domain"
contracts = "domain"
runtime = "domain"
models = "domain"
persistence = "domain"
errors = "domain"
_internal = "domain"   # private plumbing; its backends are listed as overrides below
ext = "domain"       # the door of extension authors (only an `__init__`)
kernel = "seam"      # the kernel imports LangChain, LangGraph and pydantic directly (not other awa modules)
config = "domain"      # the public door of the .env loader and the settings registry
agents = "domain"
tools = "domain"
toolkits = "domain"
skills = "domain"
memory = "domain"
data = "domain"        # profiles of the user's files; its readers are backends (overrides below)
guardrails = "domain"
team = "domain"
workflows = "domain"
messaging = "domain"
tasks = "domain"
directory = "domain"
connectors = "domain"
mcp = "domain"
people = "domain"     # the people directory; its readers are backends (overrides below)
blueprints = "domain"
quick = "root"
refine = "domain"     # awa.refine: the refinement hook decorators of a project's refine.py
evals = "domain"
server = "root"        # the HTTP server drives the library and is a composition root
automation = "domain"
observability = "domain"
testing = "testing"
ui = "root"
cli = "root"
project_setup = "root" # awa setup: writes .env, runs docker compose for local services
exporter = "root"      # awa export: reads a blueprint and writes a plain LangGraph project folder
plugins = "domain"     # awa.plugins: the plugin registry and the component switches
__main__ = "root"
checks = "root"       # awa check: the Microsoft 365 checks

[budget_exempt]
"awa/exporter/__init__.py" = "awa export: renders in a temporary folder to check it, and writes the export folder atomically"
"awa/exporter/_render.py" = "reads the project's tools and skill folders and the templates it renders"
"awa/exporter/_refuse.py" = "reads the project's tools.py to refuse imports the export cannot carry"
"awa/exporter/runtime_src/limits.py" = "copied into exports, which have no awa clock: measures the time of model and tool calls"
"awa/exporter/runtime_src/skill_loader.py" = "copied into exports: reads the skill folders of the exported project"
"awa/_internal/sandbox.py" = "the folder sandbox: the file backend of the code-execution toolkit"
"awa/_internal/filelock.py" = "the lock file next to a file several writers update: waits on the real clock"
# The importers of existing assets.
"awa/agents/graph_agent.py" = "from_langgraph: runs a foreign graph, so it owns its run ids and timings"
"awa/tools/importing.py" = "from_langchain: imports tool sources, reads the files and modules the caller names"
"awa/skills/importing.py" = "import_skills: reads prompt and skill folders and writes SKILL.md files"
# Modules that are the source of time or identifiers (GT8 does not count their calls).
"awa/_internal/ids.py" = "the default id source; every other module asks it"
"awa/runtime/clock.py" = "SystemClock: the real clock behind the Clock backend protocol"
"awa/runtime/ids.py" = "UuidIds: the default id source behind the IdSource backend protocol"
"awa/core/dotenv.py" = "the .env reader and writer: the one module that writes the project .env"
"awa/core/_envparse.py" = "the .env parser: reads one file; the loader and the registry use it"
"awa/core/config.py" = "the .env loader: the one place that reads the process environment and the project .env"
"awa/plugins/_folder.py" = "FolderSource: the one module that reads the project folder for the plugin registry"
"awa/plugins/switches.py" = "the legacy switch-file reader (read-only from the blueprint switch on)"
"awa/core/settings_registry.py" = "the settings registry: reads the blueprint names a project declares in *_env keys"
"awa/people/_file.py" = "PeopleFile: the file backend of config/people.yaml (role backend below; the package also holds domain code)"
"awa/people/_local.py" = "LocalPeople: the file backend of a local people list (role backend below)"

[[override]]
path = "awa/exporter/runtime_src/*"
role = "seam"
why = "copied into every export, which runs on LangChain and LangGraph without awa: imports them directly like the kernel"
[[override]]
path = "awa/contracts/protocols.py"
role = "protocol"
why = "AgentLike: the interface a run target must satisfy"
[[override]]
path = "awa/runtime/clock.py"
role = "protocol"
why = "Clock backend protocol, with the system clock beside it (no driver, no state)"
[[override]]
path = "awa/runtime/ids.py"
role = "protocol"
why = "IdSource backend protocol, with the uuid source beside it"
[[override]]
path = "awa/runtime/engine.py"
role = "protocol"
why = "Engine: the execution engine port every agent, team and workflow runs through"
[[override]]
path = "awa/runtime/_langgraph.py"
role = "backend"
why = "the LangGraph adapter of the engine port"

[[override]]
path = "awa/connectors/ports.py"
role = "protocol"
why = "TokenProvider and Identity: how the connector engine gets a bearer token without knowing how it was obtained"
[[override]]
path = "awa/data/ports.py"
role = "protocol"
why = "Parser and UploadScanner: the interfaces awa.data is written against"

