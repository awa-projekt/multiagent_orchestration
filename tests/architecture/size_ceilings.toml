# Code lines per package group of src/awa (`.py` files; lines that are neither blank nor a
# comment, docstrings count), checked by test_sizes.py.
#
# `ceiling` is the most a group may hold now. A change that makes a group smaller lowers its
# ceiling in the same commit (the test says when the slack is large); raising a ceiling is a
# decision with a reason in the commit message. `target` is the size the group is meant to reach.
# Every top-level package or module of src/awa is in exactly one group.

[groups.blueprints]
about = "blueprint schema, lint, compile, match, dry run, the build loop, short forms, refine"
packages = ["blueprints", "quick", "refine"]
ceiling = 18433
target = 18000

[groups.data]
about = "data profiles, readers and safe intake"
packages = ["data"]
ceiling = 8199
target = 7000

