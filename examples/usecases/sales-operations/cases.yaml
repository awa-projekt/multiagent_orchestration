- id: late-shipments-2025
  input: Wie viele Aufträge aus 2025 wurden nach dem Wunschtermin (required_date) versandt?
  tags:
  - shipping
  scorers:
  - regex:(?<![\d.,])160(?![\d]|[.,]\d)
  - tool:sales_query
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT COUNT(*) FROM orders WHERE shipped_date > required_date AND order_date LIKE '2025%'
    evidence:
    - '160'
    answer: 160 Aufträge aus 2025 wurden verspätet versandt.
- id: late-shipments-by-carrier
  input: Welcher Spediteur ist für die meisten verspäteten Lieferungen verantwortlich, und wie viele sind
    es?
  tags:
  - shipping
  - ranking
  scorers:
  - contains:Schnellfracht Nord
  - regex:(?<![\d.,])113(?![\d]|[.,]\d)
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT s.company_name, COUNT(*) AS late FROM orders o JOIN shippers s ON s.shipper_id =
          o.shipper_id WHERE o.shipped_date > o.required_date GROUP BY s.shipper_id ORDER BY late DESC
    evidence:
    - Schnellfracht Nord
    - '113'
    answer: 'Schnellfracht Nord: 113; Rheintal Logistik: 109; Paketdienst Süd: 101'
- id: open-orders
  input: Wie viele Aufträge sind noch nicht versandt, und welcher offene Auftrag ist der älteste?
  tags:
  - shipping
  scorers:
  - regex:(?<![\d.,])125(?![\d]|[.,]\d)
  - contains:105770
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT COUNT(*), MIN(order_id), MIN(order_date) FROM orders WHERE status = 'open'
    evidence:
    - '125'
    - '105770'
    answer: 125 offene Aufträge; der älteste ist 105770 vom 2025-12-12.
- id: reorder-candidates
  input: Welche aktiven Artikel müssen nachbestellt werden (Bestand plus bestellte Menge höchstens Meldebestand)?
