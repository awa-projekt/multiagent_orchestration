# Eval cases of the sales-operations use case, generated by make_cases.py from data/
# (do not edit by hand; change make_cases.py and run it again). The requests are German on
# purpose: the sales team and the data are German.
# Net revenue = SUM(unit_price * quantity * (1 - discount)) of non-cancelled orders.
#
#   awa eval examples/usecases/sales-operations/blueprint.yaml \
#       examples/usecases/sales-operations/cases.yaml \
#       --tools examples/usecases/sales-operations/tools.py
name: sales-operations
cases:
- id: top-customers-2025
  input: Welche drei Kunden hatten 2025 den höchsten Nettoumsatz? Bitte mit Umsatz je Kunde.
  tags:
  - revenue
  - ranking
  scorers:
  - contains:Garkor Partyservice AG
  - contains:Ardbel Großküchen GmbH & Co. KG
  - contains:Velkor Lebensmittel AG
  - regex:(?<![\d.,])1[.,\s]?500[.,\s]?612[.,]98
  - tool:sales_query
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT c.customer_id, TRIM(c.company_name), ROUND(SUM(l.unit_price * l.quantity * (1 -
          l.discount)), 2) AS revenue FROM orders o JOIN order_lines l ON l.order_id = o.order_id JOIN
          customers c ON c.customer_id = o.customer_id WHERE o.status <> 'cancelled' AND o.order_date
          LIKE '2025%' GROUP BY c.customer_id ORDER BY revenue DESC LIMIT 3
    evidence:
    - '1500612.98'
    - '1185495.42'
    - '588372.71'
    answer: 'Garkor Partyservice AG (GARK1): 1.500.612,98 EUR; Ardbel Großküchen GmbH & Co. KG (ARDB0):
      1.185.495,42 EUR; Velkor Lebensmittel AG (VELK1): 588.372,71 EUR'
- id: revenue-2025
  input: Wie hoch war der gesamte Nettoumsatz 2025 und wie viele Aufträge waren das (ohne stornierte)?
  tags:
  - revenue
  scorers:
  - regex:(?<![\d.,])13[.,\s]?930[.,\s]?844[.,]81
  - regex:(?<![\d.,])2[.,\s]?871(?![\d])
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT ROUND(SUM(l.unit_price * l.quantity * (1 - l.discount)), 2), COUNT(DISTINCT o.order_id)
          FROM orders o JOIN order_lines l ON l.order_id = o.order_id WHERE o.status <> 'cancelled' AND
          o.order_date LIKE '2025%'
    evidence:
    - '13930844.81'
    - '2871'
    answer: 13.930.844,81 EUR aus 2871 Aufträgen
- id: customer-revenue
  input: Wie viel Nettoumsatz hat Velkor Lebensmittel AG insgesamt gemacht, und wie viele Aufträge?
  tags:
  - revenue
  scorers:
  - regex:(?<![\d.,])1[.,\s]?188[.,\s]?717[.,]79
  - regex:(?<![\d.,])243(?![\d]|[.,]\d)
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT ROUND(SUM(l.unit_price * l.quantity * (1 - l.discount)), 2), COUNT(DISTINCT o.order_id)
