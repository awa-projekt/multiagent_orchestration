  - contains:Dunlor Meerrettich
  - contains:Garzor Malzbier
  - contains:Holbran Putenbrust
  - contains:Holsal Joghurt natur
  - contains:Lorkor Räucherlachs
  - contains:Norbel Nougatcreme
  - contains:Norkes Quark 20 %
  - contains:Norwen Matjesfilet
  - contains:Roskal Süßrahmbutter
  - contains:Wenros Senf mittelscharf
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT product_name, units_in_stock, units_on_order, reorder_level FROM products WHERE
          discontinued = 0 AND units_in_stock + units_on_order <= reorder_level ORDER BY product_name
