    - Dunlor Meerrettich
    - Garzor Malzbier
    - Holbran Putenbrust
    - Holsal Joghurt natur
    - Lorkor Räucherlachs
    - Norbel Nougatcreme
    - Norkes Quark 20 %
    - Norwen Matjesfilet
    - Roskal Süßrahmbutter
    - Wenros Senf mittelscharf
    answer: '11 Artikel: Dalkor Fruchtgummi; Dunlor Meerrettich; Garzor Malzbier; Holbran Putenbrust;
      Holsal Joghurt natur; Lorkor Räucherlachs; Norbel Nougatcreme; Norkes Quark 20 %; Norwen Matjesfilet;
      Roskal Süßrahmbutter; Wenros Senf mittelscharf'
- id: discontinued-with-stock
