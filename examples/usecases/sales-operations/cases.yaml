- id: loyalty-discount-from-data
  input: Alle Kunden mit mehr als 1.000.000 EUR Nettoumsatz 2025 bekommen 12 % Treuerabatt. Bitte die
    Kunden ermitteln und den Rabatt für jeden hinterlegen.
  tags:
  - discount
  - approval
  - multi-step
  scorers:
  - regex:ARDB0|Ardbel Großküchen GmbH \& Co\. KG
  - regex:GARK1|Garkor Partyservice AG
  - approval_granted:record_discount
  decisions:
  - action: approve
    tool: record_discount
    repeat: true
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT c.customer_id, TRIM(c.company_name), ROUND(SUM(l.unit_price * l.quantity * (1 -
          l.discount)), 2) AS revenue FROM orders o JOIN order_lines l ON l.order_id = o.order_id JOIN
          customers c ON c.customer_id = o.customer_id WHERE o.status <> 'cancelled' AND o.order_date
          LIKE '2025%' GROUP BY c.customer_id HAVING revenue > 1000000 ORDER BY c.customer_id
    evidence:
    - ARDB0
    - GARK1
    answer: 12 % Treuerabatt nach Freigabe hinterlegt für Ardbel Großküchen GmbH & Co. KG (ARDB0) und
      Garkor Partyservice AG (GARK1).
    calls:
    - tool: record_discount
      args:
        customer_id: ARDB0
        discount_percent: 12
        reason: Treuerabatt 2025
    - tool: record_discount
      args:
        customer_id: GARK1
        discount_percent: 12
        reason: Treuerabatt 2025
