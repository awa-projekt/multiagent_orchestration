- id: top-category-2025
  input: Welche Warengruppe hatte 2025 den höchsten Nettoumsatz?
  tags:
  - revenue
  - ranking
  scorers:
  - contains:Obst und Gemüse
  - regex:(?<![\d.,])1[.,\s]?982[.,\s]?362[.,]08
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT c.name, ROUND(SUM(l.unit_price * l.quantity * (1 - l.discount)), 2) AS revenue FROM
          orders o JOIN order_lines l ON l.order_id = o.order_id JOIN products p ON p.product_id = l.product_id
          JOIN categories c ON c.category_id = p.category_id WHERE o.status <> 'cancelled' AND o.order_date
          LIKE '2025%' GROUP BY c.category_id ORDER BY revenue DESC LIMIT 1
    evidence:
    - Obst und Gemüse
    - '1982362.08'
    answer: 'Obst und Gemüse: 1.982.362,08 EUR'
