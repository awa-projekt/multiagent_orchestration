    - '506'
    answer: 7 ausgelistete Artikel mit zusammen 506 Einheiten.
- id: customers-in-germany
  input: Wie viele Kunden sitzen in Deutschland?
  tags:
  - messy-data
  scorers:
  - regex:(?<![\d.,])224(?![\d]|[.,]\d)
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT country, COUNT(*), SUM(COUNT(*)) OVER () FROM customers WHERE country IN ('Deutschland',
          'DE', 'Germany', 'BRD') GROUP BY 1
    evidence:
    - '224'
    answer: '224 Kunden (geschrieben als BRD: 57, DE: 58, Deutschland: 57, Germany: 52).'
- id: top-employee-2025
  input: Welche Außendienstmitarbeiterin oder welcher Mitarbeiter hatte 2025 den höchsten Nettoumsatz,
    und wie viel?
  tags:
  - revenue
  - ranking
  scorers:
  - contains:Pfänder
  - regex:(?<![\d.,])1[.,\s]?688[.,\s]?399[.,]98
  metadata:
    steps:
    - tool: sales_query
      args:
        query: SELECT e.first_name || ' ' || e.last_name, ROUND(SUM(l.unit_price * l.quantity * (1 - l.discount)),
          2) AS revenue FROM orders o JOIN order_lines l ON l.order_id = o.order_id JOIN employees e ON
          e.employee_id = o.employee_id WHERE o.status <> 'cancelled' AND o.order_date LIKE '2025%' GROUP
