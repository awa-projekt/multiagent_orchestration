# Cases of benchmark scenario 4 (document intake). The documents are generated by data_gen.py:
# a text PDF (clean), a Word invoice above the approval limit (approved, then rejected), an Excel
# timesheet whose VAT line uses 16 % (rule V4), and a scanned PDF without a text layer.
name: document-intake
cases:
  - id: clean-pdf-booked
    input: Process the document inbox/2024-0412_mueller.pdf.
    expected: {decision: booked, invoice_number: 2024-0412, vendor_id: V-100, gross_amount: 1428.0}
    tags: [pdf, validation]
    scorers:
      - json_fields
      - tool:extract_pdf_text
      - tool:validate_invoice
      - tool:book_invoice
      - no_approval:book_invoice

  - id: large-word-invoice-approved
    input: Process the document inbox/88231_zuercher.docx.
    expected: {decision: booked, invoice_number: "88231", vendor_id: V-200, gross_amount: 21420.0}
    decisions:
      - {action: approve}
    tags: [word, approval]
    scorers:
      - json_fields
      - tool:extract_docx_text
      - tool:validate_invoice
      - approval_requested:book_invoice
      - approval_granted:book_invoice

  - id: large-word-invoice-rejected
    input: Process the document inbox/88231_zuercher.docx.
    expected: {decision: on_hold, invoice_number: "88231", gross_amount: 21420.0}
    decisions:
      - {action: reject, note: Price per pump too high; renegotiate first.}
    tags: [word, approval]
    scorers:
      - json_fields
      - approval_requested:book_invoice
      - approval_rejected:book_invoice
      - tool:hold_invoice
      - "judge:The reasons contain the reviewer's note that the price per pump is too high and must be renegotiated."

  - id: excel-wrong-vat-held
    input: Process the document inbox/ln-2024-17_meyer.xlsx.
    expected: {decision: on_hold, invoice_number: LN-2024-17, vendor_id: V-400, gross_amount: 5568.0}
    tags: [excel, validation]
    scorers:
      - json_fields
      - tool:read_excel
      - tool:validate_invoice
      - tool:hold_invoice
      - no_tool:book_invoice
      - "contains:V4"

  - id: scan-held-for-manual-entry
    input: Process the document inbox/scan_0001.pdf.
    expected: {decision: on_hold}
    tags: [pdf, scan]
    scorers:
      - json_fields
      - tool:extract_pdf_text
      - tool:hold_invoice
      - no_tool:validate_invoice
      - no_tool:book_invoice
      - "judge:The reasons say that the scan has no readable text and needs manual entry, without inventing invoice data."
