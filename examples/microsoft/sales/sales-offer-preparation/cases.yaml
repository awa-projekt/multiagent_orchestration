# Eval cases of the sales offer preparation, on the synthetic mails and the synthetic price
# list of examples/microsoft/testdata (labels C01 to C14 in a sales mailbox; `make_testdata.py`
# builds the price list for a TEST site). Prices are checked for 2026-10-05.
#
# Every check is deterministic and written down as numbers: the route and the reason of each line,
# the discount, the net and gross amount (whole cents, half up), which tools ran (an amount needs
# the calculator; a stopped line must not have one), and whether a draft was made. The expected
# amounts follow from the price list by hand: for example 10 x P-1001 at 199.90 EUR net is 1,999.00,
# less the 5 % quantity discount 1,899.05, plus 19 % tax 2,259.87.
#
# A person still reads the drafts (tone, language); this file proves the numbers and the stops.
#
#   awa eval examples/microsoft/sales/sales-offer-preparation/blueprint.yaml examples/microsoft/sales/sales-offer-preparation/cases.yaml
name: sales-offer-preparation
cases:
  - id: complete-request
    # 10 x P-1001: tier 5 %, net 1,899.05, gross 2,259.87.
    input: Prepare the offer for the unread request with the subject 'Offer request C01' (prices valid on 2026-10-05).
    expected:
      complete: true
      requests.0.suspicious_content: false
      requests.0.draft: offer
      requests.0.lines.0.product_no: P-1001
      requests.0.lines.0.quantity: 10
      requests.0.lines.0.route: ready_for_review
      requests.0.lines.0.reason: ok
      requests.0.lines.0.discount_pct: 5
      requests.0.lines.0.line_net: 1899.05
      requests.0.lines.0.line_gross: 2259.87
    decisions: [{action: approve, tool: mail_create_reply_draft, repeat: true}]
    scorers: [json_fields, tool:mail_read_message, tool:workspace_query_excel, tool:calculator, tool:mail_create_reply_draft]

  - id: quantity-just-below-the-first-tier
    # 9 x P-1001: no discount below 10 pieces.
    input: Prepare the offer for the unread request with the subject 'Offer request C02a' (prices valid on 2026-10-05).
