# Synthetic mails for the six Microsoft process examples (invented people, products and numbers).
#
# The offline tests put these mails into a local Microsoft Graph test server and run the examples
# against them. To try an example on a REAL test mailbox, send yourself the mails of its cases
# (subject and text exactly as written, from any address) and read the case file next to the
# example. Never use real customer mail for the acceptance runs of these cases.
#
# `label` ties a mail to the cases; `mailbox` says which mailbox it belongs to (sales,
# administration or process); `headers` are internet message headers.
mails:
